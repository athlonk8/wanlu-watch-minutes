<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>腕录 · 接收录音</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><header><span class="mark">腕</span><div><h1>接收这段录音</h1><p>从手腕，到你的听悟</p></div></header><section><span class="step">01 · 保存到手机</span><h2 id="name">正在连接手表…</h2><form id="pair" hidden><label for="pin">手表上显示的六位配对码</label><input id="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required><button class="primary" type="submit">连接手表</button></form><p id="meta"></p><a class="primary" id="download" href="/audio" download hidden>下载录音到手机</a><p id="status" role="status" aria-live="polite">请使用手表显示的完整二维码或地址打开。</p></section><section><span class="step">02 · 在听悟导入</span><h2>使用你现有的听悟账号</h2><p>下载完成后，打开通义听悟，选择导入本地音视频文件，找到刚才保存的录音。转写和纪要在听悟中查看。</p><a id="tingwu" href="https://tingwu.aliyun.com/home" target="_blank" rel="noreferrer">打开通义听悟 ↗</a><p class="small">此页面只负责把文件交给手机，不会自动上传听悟，也不会读取听悟账号或会员信息。</p></section><footer>只分享你在手表选中的一段录音<br>会话 15 分钟后自动关闭</footer></main></body></html>
