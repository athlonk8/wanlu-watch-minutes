[api]
# 阿里云百炼 API-KEY(必填)。https://bailian.console.aliyun.com → 右上角头像 → API-KEY
# 也可以不填这里,改用环境变量 DASHSCOPE_API_KEY
dashscope_api_key =

[asr]
model = paraformer-v2
language_hints = zh,en
diarization = true

[minutes]
# 纪要生成走 OpenAI 兼容接口,默认百炼 qwen-plus。
# 想换智谱 GLM: base_url = https://open.bigmodel.cn/api/paas/v4  model = glm-4-plus  api_key = 智谱的key
enabled = true
base_url = https://dashscope.aliyuncs.com/compatible-mode/v1
model = qwen-plus
api_key =
